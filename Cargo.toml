[package]
name = "Lya"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Local-first AI agent and autonomous development orchestrator"
repository = "https://github.com/Sharkou/Lya"
readme = "README.md"
license = "MIT"
keywords = ["agent", "orchestrator", "automation", "cli", "llm"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "lya"

# The published command is `lya` on every platform. The package keeps its original
# casing, so this only fixes the executable file name Cargo would otherwise derive
# from it (`Lya.exe` on Windows, `Lya` elsewhere).
[[bin]]
name = "lya"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
# `pause`/`advance`, so a test can cross a timeout without waiting for one.
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# `GetConsoleWindow` / `GetConsoleProcessList`, so a test can prove a spawned
# provider-style child really has no console instead of asserting that a creation
# flag appears in the source. Test-only: the shipped binary does not grow.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }
